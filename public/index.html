<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transcript Generator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Transcript Generator</h1>
    <p class="subtitle">Fill in the details below, then export as Word or PDF. Headings stay fixed — only your entries change.</p>

    <form id="transcriptForm">
      <section class="card">
        <h2>Student &amp; Program Details</h2>
        <div class="grid2">
          <label>Name of the Student
            <input type="text" name="studentName" placeholder="Mr. John Doe" required />
          </label>
          <label>Program Name
            <input type="text" name="programName" placeholder="Technovalley Certified SOC Professional" required />
          </label>
          <label>Program Duration
            <input type="text" name="programDuration" placeholder="60 Hours" required />
          </label>
          <label>Overall Grade
            <input type="text" name="overallGrade" placeholder="A / A+" required />
          </label>
          <label>Start Date
            <input type="text" name="startDate" placeholder="May 2026" required />
          </label>
          <label>End Date
            <input type="text" name="endDate" placeholder="July 2026" required />
          </label>
          <label>Final Result
            <select name="finalResult">
              <option value="Passed">Passed</option>
              <option value="Failed">Failed</option>
              <option value="Distinction">Distinction</option>
            </select>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Course Result Table</h2>
        <div class="variant-toggle">
          <label><input type="radio" name="variant" value="assessment" checked /> Assessment (Attendance / Participation / Assignment)</label>
          <label><input type="radio" name="variant" value="marks" /> Marks (Total / Pass / Gained)</label>
        </div>

        <div id="rowsContainer"></div>
        <button type="button" id="addRowBtn" class="secondary">+ Add Row</button>
      </section>

      <section class="card">
        <h2>Signatory</h2>
        <div class="grid2">
          <label>Signatory Name
            <input type="text" name="signatoryName" placeholder="Divya S Nair" required />
          </label>
          <label>Signatory Title
            <input type="text" name="signatoryTitle" placeholder="Director - Academics" required />
          </label>
          <label>Date
            <input type="text" name="issueDate" placeholder="02/09/2026" required />
          </label>
        </div>
      </section>

      <div class="actions">
        <button type="button" id="downloadDocx">Download Word (.docx)</button>
        <button type="button" id="downloadPdf">Download PDF</button>
      </div>
      <p id="statusMsg" class="status"></p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
